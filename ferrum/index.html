<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ferrum" />
    <meta name="description" content="Ferrum — registro de entrenamientos de fuerza. 100% local y sin conexión." />
    <title>Ferrum</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <script>
      /* Diagnóstico de arranque (temporal): si la app queda en negro, este cuadro
         rojo muestra el motivo en vez de dejar la pantalla muda. Solo aparece si
         el JS falla o no llega a arrancar. */
      (function () {
        var msgs = [];
        function show() {
          var el = document.getElementById('ferrum-diag');
          if (!el) {
            el = document.createElement('div');
            el.id = 'ferrum-diag';
            el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#3d0a0a;color:#ffe1e1;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px 12px;white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow:auto;border-top:2px solid #ff5b5b;text-align:left';
            (document.body || document.documentElement).appendChild(el);
          }
          el.textContent = 'FERRUM · diagnóstico de arranque\n' + msgs.join('\n');
        }
        function push(m) { msgs.push(m); show(); }
        window.addEventListener('error', function (e) {
          var t = e.target && e.target !== window && e.target.tagName
            ? e.target.tagName + ' ' + (e.target.src || e.target.href || '') : '';
          push('error: ' + (e.message || '(sin mensaje)') +
            (e.filename ? ' @' + e.filename + ':' + e.lineno : '') +
            (t ? ' [' + t + ']' : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          push('promesa rechazada: ' + String((r && (r.stack || r.message)) || r || '(vacío)').slice(0, 600));
        });
        setTimeout(function () {
          var ok = window.__ferrumBooted ||
            document.querySelector('#pin-gate, nav.tabbar, #view > *');
          if (!ok) {
            push('TIMEOUT 8s: el JS no llegó a arrancar ni a pintar nada.\n' +
              'Causas probables: bloqueador de contenido o extensión de Safari bloqueando\n' +
              'el bundle, JavaScript desactivado en Ajustes, o la descarga del JS falló.');
          }
        }, 8000);
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-ClwCvYpI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CGI_N6OW.css">
  </head>
  <body>
    <div id="app"><main id="view"></main></div>
  </body>
</html>
