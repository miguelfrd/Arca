<!doctype html>
<html lang="es" data-ferrum-ui="atelier" data-fui-skin="command">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ferrum" />
    <meta name="description" content="Ferrum — tus entrenamientos en el móvil, con un círculo privado de amigos opcional." />
    <title>Ferrum</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <!-- Capa visual Ferrum Atelier: el script solo enriquece la presentación. -->
    <script defer src="./ui/ferrum-ui-v1.js"></script>
    <!-- Idioma y estilo: antes de nada, para que la primera pantalla ya salga
         en el idioma y la paleta elegidos. El diccionario inglés solo se
         descarga si el idioma es inglés. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('ferrum-lang') === 'en') document.write('<script src="./ui/ferrum-i18n-en-v1.js"><\/script>');
        } catch (e) {}
      })();
    </script>
    <script src="./ui/ferrum-i18n-v1.js"></script>
    <script>
      /* Diagnóstico de arranque (temporal): si la app queda en negro, este cuadro
         rojo muestra el motivo en vez de dejar la pantalla muda. Solo aparece si
         el JS falla o no llega a arrancar. */
      (function () {
        var msgs = [];
        function show() {
          var el = document.getElementById('ferrum-diag');
          if (!el) {
            el = document.createElement('div');
            el.id = 'ferrum-diag';
            el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#3d0a0a;color:#ffe1e1;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px 12px;white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow:auto;border-top:2px solid #ff5b5b;text-align:left';
            (document.body || document.documentElement).appendChild(el);
          }
          el.textContent = 'FERRUM · diagnóstico de arranque\n' + msgs.join('\n');
        }
        function push(m) { msgs.push(m); show(); }
        window.addEventListener('error', function (e) {
          var t = e.target && e.target !== window && e.target.tagName
            ? e.target.tagName + ' ' + (e.target.src || e.target.href || '') : '';
          push('error: ' + (e.message || '(sin mensaje)') +
            (e.filename ? ' @' + e.filename + ':' + e.lineno : '') +
            (t ? ' [' + t + ']' : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          push('promesa rechazada: ' + String((r && (r.stack || r.message)) || r || '(vacío)').slice(0, 600));
        });
        setTimeout(function () {
          var ok = window.__ferrumBooted ||
            document.querySelector('#pin-gate, nav.tabbar, #view > *');
          if (!ok) {
            push('TIMEOUT 8s: el JS no llegó a arrancar ni a pintar nada.\n' +
              'Causas probables: bloqueador de contenido o extensión de Safari bloqueando\n' +
              'el bundle, JavaScript desactivado en Ajustes, o la descarga del JS falló.');
          }
        }, 8000);
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-ds5ONjEG.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cs_ZKcHx.css">
  </head>
  <body>
    <!-- Versión siempre visible, arriba a la izquierda, en pequeño.
         Muestra la versión del service worker que sirve la app (la que realmente corre);
         si no hay SW, queda el valor escrito en el despliegue. -->
    <div id="ferrum-version" aria-hidden="true" style="position:fixed;top:calc(env(safe-area-inset-top, 0px) + 4px);left:8px;z-index:9999;font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;opacity:.55;pointer-events:none;color:#888">v67</div>
    <script>
      (function () {
        var el = document.getElementById('ferrum-version');
        if (!el) return;
        fetch('./sw-version', { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
          t = (t || '').trim().replace(/^ferrum-/, '');
          if (t) el.textContent = t;
        }).catch(function () {});
      })();
    </script>
    <div id="app"><main id="view"></main></div>
    <!-- Aviso de instalación: en el navegador (no webapp), invita a guardar la
         app en pantalla de inicio ANTES de crear la cuenta. Así el perfil queda
         en la webapp y no se duplica entre el navegador y la webapp. -->
    <script>
      (function () {
        try {
          var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || !!navigator.standalone;
          if (standalone) return;
          if (window.matchMedia && !window.matchMedia('(pointer: coarse)').matches) return;
          if (localStorage.getItem('ferrum-install-dismissed') === '1') return;
          if (sessionStorage.getItem('ferrum-install-skip') === '1') return;
        } catch (e) { return; }
        function dismiss(permanent) {
          try {
            if (permanent) localStorage.setItem('ferrum-install-dismissed', '1');
            else sessionStorage.setItem('ferrum-install-skip', '1');
          } catch (e) {}
          var el = document.getElementById('ferrum-install-prompt');
          if (el) el.remove();
        }
        var overlay = document.createElement('div');
        overlay.id = 'ferrum-install-prompt';
        overlay.style.cssText = 'position:fixed;inset:0;z-index:9998;background:#f6f4ef;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;';
        overlay.innerHTML = '<div style="max-width:360px;width:100%;text-align:center;">' +
          '<h2 style="font-size:24px;margin:0 0 10px;color:#1a1a1a;">Guarda Ferrum en tu pantalla de inicio</h2>' +
          '<p style="font-size:15px;line-height:1.5;color:#555;margin:0 0 18px;">Antes de crear tu cuenta, guarda la app. Así queda como una app normal y tu cuenta no se duplica entre el navegador y la webapp.</p>' +
          '<ol style="text-align:left;font-size:15px;line-height:1.6;color:#333;margin:0 0 22px;padding-left:22px;">' +
          '<li>Pulsa <strong>Compartir</strong> (el icono de abajo).</li>' +
          '<li>Elige <strong>Añadir a pantalla de inicio</strong>.</li>' +
          '<li>Abre Ferrum desde el icono nuevo.</li></ol>' +
          '<button id="ferrum-install-done" style="display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#c2410c;color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:10px;">Ya la guardé</button>' +
          '<button id="ferrum-install-skip" style="display:block;width:100%;padding:12px;border:0;background:transparent;color:#666;font-size:15px;cursor:pointer;">Continuar en el navegador</button>' +
          '</div>';
        (document.body || document.documentElement).appendChild(overlay);
        document.getElementById('ferrum-install-done').addEventListener('click', function () { dismiss(true); });
        document.getElementById('ferrum-install-skip').addEventListener('click', function () { dismiss(false); });
      })();
    </script>
    <!-- Hoja de la capa visual Atelier: al final para que vaya DESPUÉS de la
         hoja compilada por vite (la inyecta al final del head en el build). -->
    <link rel="stylesheet" href="./ui/ferrum-ui-v1.css" />
    <link rel="stylesheet" href="./ui/ferrum-v2.css" />
    <!-- Diseño «Command» (estilo Raycast) + movimiento (estilo GSAP). -->
    <link rel="stylesheet" href="./ui/ferrum-command-v1.css" />
    <script defer src="./ui/ferrum-command-motion-v1.js"></script>
    <!-- Ajustes al estilo iOS + Salud, y estiramientos guiados. -->
    <link rel="stylesheet" href="./ui/ferrum-settings-v1.css" />
    <script defer src="./ui/ferrum-settings-v1.js"></script>
    <link rel="stylesheet" href="./ui/ferrum-stretch-v1.css" />
    <script defer src="./ui/ferrum-stretch-figure-v1.js"></script>
    <script defer src="./ui/ferrum-stretch-data-v1.js"></script>
    <script defer src="./ui/ferrum-stretch-v1.js"></script>
  </body>
</html>
