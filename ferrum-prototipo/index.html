<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1312">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ferrum · Prototipo</title>
</head>
<body>
<style>
html,body{height:100%}
body{margin:0;background:#070b0a;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body *{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.fp-screen{position:relative;width:100%;max-width:430px;margin:0 auto;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:#0d1312;color:#eef4f2}
.fp-screen[data-app-theme="light"]{background:#f2f5f4;color:#0f1514}
@media (min-width:500px){.fp-screen{border-left:1px solid rgba(255,255,255,.07);border-right:1px solid rgba(255,255,255,.07)}}
.fp-note{margin:18px 0 0;font-size:12.5px;color:#8fa19c;text-align:center;line-height:1.5}
.fp-screen[data-app-theme="light"] .fp-note{color:#5f6f6a}
.fp-app{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;padding-top:env(safe-area-inset-top)}
.fp-app::-webkit-scrollbar{display:none}
.fp-page{padding:6px 18px 26px;animation:fpIn .22s ease}
@keyframes fpIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fp-h1{font-size:27px;font-weight:700;letter-spacing:-.4px;margin:10px 0 4px}
.fp-sub{font-size:13px;color:#8fa19c;margin:0 0 16px;line-height:1.45}
.fp-screen[data-app-theme="light"] .fp-sub{color:#5f6f6a}
.fp-sec{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#8fa19c;margin:22px 0 10px}
.fp-screen[data-app-theme="light"] .fp-sec{color:#5f6f6a}
.fp-card{background:#141b1a;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 15px}
.fp-screen[data-app-theme="light"] .fp-card{background:#fff;border-color:rgba(0,0,0,.08)}
.fp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
.fp-screen[data-app-theme="light"] .fp-row{border-color:rgba(0,0,0,.07)}
.fp-row:last-child{border-bottom:none}
.fp-row .t{font-size:15px;font-weight:600}
.fp-row .s{font-size:12.5px;color:#8fa19c;margin-top:3px;font-variant-numeric:tabular-nums}
.fp-screen[data-app-theme="light"] .fp-row .s{color:#5f6f6a}
.fp-btn{display:block;width:100%;border:none;border-radius:13px;padding:15px;font-size:16px;font-weight:700;background:#2dd4bf;color:#04211d;cursor:pointer;font-family:inherit}
.fp-btn:active{transform:scale(.985)}
.fp-btn-ghost{display:block;width:100%;border-radius:13px;padding:13px;font-size:15px;font-weight:600;background:transparent;color:#2dd4bf;border:1px solid rgba(45,212,191,.4);cursor:pointer;font-family:inherit}
.fp-chip{display:inline-block;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.14);color:#c9d4d1;background:transparent;cursor:pointer;margin:0 8px 8px 0;font-family:inherit}
.fp-chip.on{background:rgba(45,212,191,.15);border-color:#2dd4bf;color:#2dd4bf}
.fp-screen[data-app-theme="light"] .fp-chip{border-color:rgba(0,0,0,.14);color:#33403d}
.fp-screen[data-app-theme="light"] .fp-chip.on{background:rgba(15,118,110,.1);border-color:#0f766e;color:#0f766e}
.fp-tabbar{flex:0 0 auto;display:flex;border-top:1px solid rgba(255,255,255,.08);background:rgba(13,19,18,.96);padding:10px 2px calc(10px + env(safe-area-inset-bottom));z-index:20}
.fp-screen[data-app-theme="light"] .fp-tabbar{background:rgba(242,245,244,.96);border-color:rgba(0,0,0,.08)}
.fp-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:#7d8b88;font-size:9.5px;font-weight:600;cursor:pointer;font-family:inherit;padding:2px 0}
.fp-tab svg{width:23px;height:23px}
.fp-tab.on{color:#2dd4bf}
.fp-screen[data-app-theme="light"] .fp-tab{color:#7a8783}
.fp-screen[data-app-theme="light"] .fp-tab.on{color:#0f766e}
.fp-back{background:none;border:none;color:#2dd4bf;font-size:15px;font-weight:600;cursor:pointer;padding:8px 0;font-family:inherit}
.fp-num{font-variant-numeric:tabular-nums}
/* PIN */
.fp-pin{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:0 34px}
.fp-brand{font-size:15px;font-weight:700;letter-spacing:9px;color:#eef4f2;margin-bottom:44px;padding-left:9px}
.fp-dots{display:flex;gap:18px;margin-bottom:44px}
.fp-dots span{width:15px;height:15px;border-radius:50%;border:1.5px solid #5b6865;transition:all .12s}
.fp-dots span.f{background:#2dd4bf;border-color:#2dd4bf}
.fp-pad{display:grid;grid-template-columns:repeat(3,84px);gap:14px;justify-content:center}
.fp-key{width:84px;height:84px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:#161d1c;color:#f2f5f4;font-size:27px;font-weight:500;cursor:pointer;font-family:inherit;font-variant-numeric:tabular-nums}
.fp-key:active{background:#232d2b}
.fp-key.fn{border:none;font-size:15px;color:#8fa19c}
/* workout */
.fp-timer-card{text-align:center;padding:20px 16px 16px;margin-bottom:6px}
.fp-timer-label{font-size:11px;font-weight:700;letter-spacing:2.5px;color:#8fa19c;margin-bottom:6px}
.fp-timer{font-size:64px;font-weight:200;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 12px}
.fp-timer-row{display:flex;gap:10px}
.fp-timer-row .fp-btn-ghost{padding:11px;font-size:14px}
.fp-ex{margin-top:14px}
.fp-ex-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fp-ex-name{font-size:15px;font-weight:700;letter-spacing:.2px}
.fp-ex-del{background:none;border:none;color:#8fa19c;font-size:12px;cursor:pointer;font-family:inherit}
.fp-set-head,.fp-set{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:6px;align-items:center;padding:9px 0}
.fp-set-head{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:#8fa19c;border-bottom:1px solid rgba(255,255,255,.08)}
.fp-screen[data-app-theme="light"] .fp-set-head{border-color:rgba(0,0,0,.08);color:#5f6f6a}
.fp-set{border-bottom:1px solid rgba(255,255,255,.05);font-variant-numeric:tabular-nums}
.fp-screen[data-app-theme="light"] .fp-set{border-color:rgba(0,0,0,.05)}
.fp-set.done .sv{color:#2dd4bf}
.fp-screen[data-app-theme="light"] .fp-set.done .sv{color:#0f766e}
.fp-set input{width:100%;background:#0d1312;border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#eef4f2;font-size:15px;padding:8px 6px;text-align:center;font-family:inherit;font-variant-numeric:tabular-nums}
.fp-screen[data-app-theme="light"] .fp-set input{background:#f2f5f4;border-color:rgba(0,0,0,.12);color:#0f1514}
.fp-check{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:transparent;color:transparent;font-size:16px;cursor:pointer;justify-self:end}
.fp-set.done .fp-check{background:#2dd4bf;border-color:#2dd4bf;color:#04211d;font-weight:800}
.fp-addset{width:100%;margin-top:10px;background:rgba(45,212,191,.08);border:1px dashed rgba(45,212,191,.4);color:#2dd4bf;border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
/* orders chat */
.fp-chat{display:flex;flex-direction:column;gap:10px;padding:4px 0 12px}
.fp-msg{max-width:85%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.5}
.fp-msg.app{background:#1a2221;align-self:flex-start;border-bottom-left-radius:5px;white-space:pre-line}
.fp-screen[data-app-theme="light"] .fp-msg.app{background:#e7edeb}
.fp-msg.user{background:rgba(45,212,191,.16);border:1px solid rgba(45,212,191,.35);align-self:flex-end;border-bottom-right-radius:5px}
.fp-chatbar{display:flex;gap:8px;padding:10px 0 4px}
.fp-chatbar input{flex:1;background:#141b1a;border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#eef4f2;font-size:15px;padding:12px;font-family:inherit}
.fp-screen[data-app-theme="light"] .fp-chatbar input{background:#fff;border-color:rgba(0,0,0,.12);color:#0f1514}
.fp-send{border:none;border-radius:12px;background:#2dd4bf;color:#04211d;font-weight:700;font-size:15px;padding:0 18px;cursor:pointer;font-family:inherit}
/* stats */
.fp-kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:6px}
.fp-kpi{background:#141b1a;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:13px 12px}
.fp-screen[data-app-theme="light"] .fp-kpi{background:#fff;border-color:rgba(0,0,0,.08)}
.fp-kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.fp-kpi .l{font-size:10.5px;color:#8fa19c;margin-top:4px;letter-spacing:.6px;text-transform:uppercase}
.fp-bars{display:flex;align-items:flex-end;gap:9px;height:150px;padding:14px 4px 4px}
.fp-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.fp-bar i{width:100%;max-width:30px;background:rgba(45,212,191,.28);border-radius:5px 5px 2px 2px;min-height:4px}
.fp-bar.max i{background:#2dd4bf}
.fp-bar b{font-size:10px;color:#8fa19c;font-weight:600}
/* toast */
.fp-toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);background:#232e2c;color:#eef4f2;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.12);opacity:0;pointer-events:none;transition:all .25s;z-index:40;white-space:nowrap}
.fp-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fp-2col{display:flex;gap:10px}
.fp-2col .fp-card{flex:1}
.fp-meas-input{display:flex;gap:8px;margin-top:12px}
.fp-meas-input input{flex:1;background:#141b1a;border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#eef4f2;font-size:16px;padding:12px;font-family:inherit;font-variant-numeric:tabular-nums}
.fp-screen[data-app-theme="light"] .fp-meas-input input{background:#fff;border-color:rgba(0,0,0,.12);color:#0f1514}
.fp-search{width:100%;box-sizing:border-box;background:#141b1a;border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#eef4f2;font-size:15px;padding:12px 14px;margin:6px 0 4px;font-family:inherit}
.fp-screen[data-app-theme="light"] .fp-search{background:#fff;border-color:rgba(0,0,0,.12);color:#0f1514}
.fp-muscle{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#2dd4bf;margin:18px 0 2px}
.fp-screen[data-app-theme="light"] .fp-muscle{color:#0f766e}
.fp-go{background:none;border:none;color:#5b6865;font-size:18px;cursor:pointer;padding:4px 0 4px 10px}
.fp-empty{text-align:center;color:#8fa19c;font-size:14px;padding:34px 20px;line-height:1.6}
</style>
<div class="fp-screen" id="fp-screen" data-app-theme="dark">
  <div class="fp-app" id="fp-app"></div>
  <nav class="fp-tabbar" id="fp-tabbar" style="display:none"></nav>
  <div class="fp-toast" id="fp-toast"></div>
</div>
<script>
"use strict";
var W = window.hatchWidget || null;
var DEFAULTS = {
  authed:false, pin:"", screen:"train", theme:"dark",
  workout:null, restLeft:0, restRunning:false,
  history:[
    {id:"h1",name:"Pecho · Día 3",date:"Ayer · 28 min",vol:"4.820 kg",sets:12,detail:"Press banca plano 4×10×80 · Inclinado manc. 4×10×32 · Fondos 4×12"},
    {id:"h2",name:"Pierna A",date:"Hace 3 días · 41 min",vol:"7.150 kg",sets:14,detail:"Sentadilla 4×6×110 · Prensa 4×10×180 · Peso muerto 3×5×140"},
    {id:"h3",name:"Torso",date:"Hace 5 días · 52 min",vol:"6.030 kg",sets:16,detail:"Dominadas 4×8 · Press banca 4×8×75 · Remo barra 4×10×60"}
  ],
  routines:[
    {id:"r1",name:"Pecho · Día 3",note:"Rutina Fuerza · Semana 5",ex:["press-banca","press-inclinado","fondos"]},
    {id:"r2",name:"Pierna A",note:"Rutina Fuerza · Semana 5",ex:["sentadilla","prensa","peso-muerto"]},
    {id:"r3",name:"Torso",note:"Full body",ex:["dominadas","press-banca","remo-barra","press-militar"]}
  ],
  measures:[
    {d:"Hoy",v:"82,4 kg"},{d:"Hace 1 sem",v:"82,9 kg"},{d:"Hace 2 sem",v:"83,5 kg"},{d:"Hace 3 sem",v:"84,1 kg"}
  ],
  chat:[{from:"app",text:"Órdenes: escríbeme en español.\nPrueba: «ayuda», «crea rutina pierna suave» o «apunta 80x10 press banca»."}],
  pickEx:false, exDetail:null
};
var S = W ? W.getState(DEFAULTS) : JSON.parse(JSON.stringify(DEFAULTS));
function save(){ if(W){ try{W.setState(S);}catch(e){} } }
if(W){ window.addEventListener("hatch-widget-state",function(e){ S=e.detail.state||S; render(); }); }
var EX = [
  {id:"press-banca",name:"Press banca plano",muscle:"Pecho"},
  {id:"press-inclinado",name:"Press inclinado con mancuernas",muscle:"Pecho"},
  {id:"fondos",name:"Fondos en paralelas",muscle:"Pecho"},
  {id:"dominadas",name:"Dominadas",muscle:"Espalda"},
  {id:"remo-barra",name:"Remo con barra",muscle:"Espalda"},
  {id:"peso-muerto",name:"Peso muerto",muscle:"Espalda"},
  {id:"sentadilla",name:"Sentadilla con barra",muscle:"Pierna"},
  {id:"prensa",name:"Prensa de piernas",muscle:"Pierna"},
  {id:"press-militar",name:"Press militar",muscle:"Hombro"},
  {id:"elevaciones",name:"Elevaciones laterales",muscle:"Hombro"},
  {id:"curl-biceps",name:"Curl de bíceps con barra",muscle:"Bíceps"},
  {id:"triceps-polea",name:"Extensión de tríceps en polea",muscle:"Tríceps"}
];
function exName(id){ var e=EX.find(function(x){return x.id===id;}); return e?e.name:id; }
var TABS=[
  {id:"train",label:"Entrenar",svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>'},
  {id:"orders",label:"Órdenes",svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/><path d="M9 11l2 2 4-4"/></svg>'},
  {id:"routines",label:"Rutinas",svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg>'},
  {id:"exercises",label:"Ejercicios",svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13"/></svg>'},
  {id:"stats",label:"Stats",svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-8M21 20H3"/></svg>'},
  {id:"measures",label:"Medidas",svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l9-9 4 4-9 9H3v-4z"/><path d="M7.5 13.5l2 2M10.5 10.5l2 2M13.5 7.5l2 2"/></svg>'},
  {id:"more",label:"Más",svg:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>'}
];
</script>
<script>
/* ---- render ---- */
var app=document.getElementById("fp-app"), tabbar=document.getElementById("fp-tabbar"),
    screenEl=document.getElementById("fp-screen"), toastEl=document.getElementById("fp-toast");
var toastT=null;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove("show");},2200); }
function fmt(s){ s=Math.max(0,s); var m=Math.floor(s/60), r=s%60; return (m<10?"0"+m:m)+":"+(r<10?"0"+r:r); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function render(){
  screenEl.setAttribute("data-app-theme", S.theme);
  if(!S.authed){ tabbar.style.display="none"; app.innerHTML=pinHTML(); return; }
  tabbar.style.display="flex";
  tabbar.innerHTML=TABS.map(function(t){
    return '<button class="fp-tab'+(S.screen===t.id?" on":"")+'" data-action="go" data-to="'+t.id+'">'+t.svg+'<span>'+t.label+'</span></button>';
  }).join("");
  var h="";
  if(S.screen==="train") h=trainHTML();
  else if(S.screen==="workout") h=workoutHTML();
  else if(S.screen==="orders") h=ordersHTML();
  else if(S.screen==="routines") h=routinesHTML();
  else if(S.screen==="exercises") h=exercisesHTML("");
  else if(S.screen==="exercise") h=exerciseHTML();
  else if(S.screen==="stats") h=statsHTML();
  else if(S.screen==="measures") h=measuresHTML();
  else if(S.screen==="more") h=moreHTML();
  app.innerHTML='<div class="fp-page">'+h+'</div>';
  app.scrollTop=0;
  var t=document.getElementById("fp-timer"); if(t&&S.restRunning) t.textContent=fmt(S.restLeft);
}

function pinHTML(){
  var dots=""; for(var i=0;i<4;i++) dots+='<span class="'+(S.pin.length>i?"f":"")+'"></span>';
  var keys=[1,2,3,4,5,6,7,8,9,"",0,"del"].map(function(k){
    if(k==="") return '<span></span>';
    if(k==="del") return '<button class="fp-key fn" data-action="pin-del">Borrar</button>';
    return '<button class="fp-key" data-action="pin-digit" data-d="'+k+'">'+k+'</button>';
  }).join("");
  return '<div class="fp-pin"><div class="fp-brand">FERRUM</div><div class="fp-dots">'+dots+'</div><div class="fp-pad">'+keys+'</div></div>';
}

function trainHTML(){
  var w=S.workout;
  var active = w ? '<div class="fp-card" style="margin-bottom:14px"><div class="fp-row" style="border:none;padding:4px 2px"><div><div class="t">'+esc(w.name)+'</div><div class="s fp-num">'+w.exercises.length+' ejercicios · en curso</div></div><button class="fp-go" data-action="go" data-to="workout">›</button></div><button class="fp-btn-ghost" data-action="go" data-to="workout" style="margin-top:10px">Continuar entreno</button></div>' : "";
  var hist = S.history.map(function(x){
    return '<div class="fp-row"><div><div class="t">'+esc(x.name)+'</div><div class="s">'+esc(x.date)+' · <span class="fp-num">'+x.sets+' series · '+esc(x.vol)+'</span></div></div><button class="fp-go" data-action="go" data-to="train">›</button></div>';
  }).join("");
  return '<div class="fp-h1">Entrenar</div><p class="fp-sub">Empieza un entreno vacío o tira de una rutina.</p>'
    + active
    + '<button class="fp-btn" data-action="start-empty">Empezar entreno vacío</button>'
    + '<div style="height:6px"></div><button class="fp-btn-ghost" data-action="go" data-to="routines">Elegir rutina</button>'
    + '<div class="fp-sec">Historial</div><div class="fp-card" style="padding:4px 15px">'+hist+'</div>';
}

function workoutHTML(){
  var w=S.workout; if(!w) return '<div class="fp-empty">No hay entreno activo.</div><button class="fp-btn" data-action="start-empty">Empezar entreno vacío</button>';
  var timerBtns = S.restRunning
    ? '<button class="fp-btn-ghost" data-action="timer-pause">Pausar</button><button class="fp-btn-ghost" data-action="timer-skip">Saltar</button>'
    : '<button class="fp-btn-ghost" data-action="timer-start">Iniciar 1:30</button><button class="fp-btn-ghost" data-action="timer-add">+30 s</button>';
  var exs = w.exercises.map(function(e,ei){
    var rows=e.sets.map(function(s,si){
      return '<div class="fp-set'+(s.done?" done":"")+'"><span class="sv fp-num">'+(si+1)+'</span>'
        +'<input data-ex="'+ei+'" data-set="'+si+'" data-f="kg" value="'+esc(s.kg)+'" inputmode="decimal">'
        +'<input data-ex="'+ei+'" data-set="'+si+'" data-f="reps" value="'+esc(s.reps)+'" inputmode="numeric">'
        +'<button class="fp-check" data-action="toggle-set" data-ex="'+ei+'" data-set="'+si+'">✓</button></div>';
    }).join("");
    return '<div class="fp-ex"><div class="fp-ex-head"><span class="fp-ex-name">'+esc(exName(e.exId))+'</span><button class="fp-ex-del" data-action="del-ex" data-ex="'+ei+'">Quitar</button></div>'
      +'<div class="fp-card" style="padding:4px 14px"><div class="fp-set-head"><span></span><span>KG</span><span>REPS</span><span></span></div>'+rows+'</div>'
      +'<button class="fp-addset" data-action="add-set" data-ex="'+ei+'">+ Añadir serie</button></div>';
  }).join("");
  var picker="";
  if(S.pickEx){
    var avail=EX.filter(function(x){return !w.exercises.some(function(e){return e.exId===x.id;});});
    picker='<div class="fp-sec">Añadir ejercicio</div><div class="fp-card" style="padding:4px 15px">'
      + avail.map(function(x){return '<div class="fp-row"><div><div class="t" style="font-size:14px">'+esc(x.name)+'</div><div class="s">'+esc(x.muscle)+'</div></div><button class="fp-go" data-action="pick" data-id="'+x.id+'">+</button></div>';}).join("")
      +'</div>';
  }
  return '<button class="fp-back" data-action="go" data-to="train">‹ Entrenar</button>'
    +'<div class="fp-h1" style="font-size:23px">'+esc(w.name)+'</div>'
    +'<div class="fp-card fp-timer-card"><div class="fp-timer-label">DESCANSO</div><div class="fp-timer" id="fp-timer">'+fmt(S.restLeft)+'</div><div class="fp-timer-row">'+timerBtns+'</div></div>'
    + exs + picker
    +'<div style="height:14px"></div><button class="fp-btn-ghost" data-action="toggle-pick">'+(S.pickEx?"Cerrar selector":"+ Añadir ejercicio")+'</button>'
    +'<div style="height:10px"></div><button class="fp-btn" data-action="finish">Terminar entreno</button><div style="height:8px"></div>';
}
</script>
<script>
function ordersHTML(){

  var chips=["ayuda","crea rutina pierna suave","apunta 80x10 press banca"].map(function(c){

  return '<div class="fp-h1">Órdenes</div><p class="fp-sub">Escríbeme en español: crear, apuntar, consultar, temporizar.</p>'

}
function routinesHTML(){
  var list=S.routines.map(function(r){
    return '<div class="fp-row"><div><div class="t">'+esc(r.name)+'</div><div class="s">'+esc(r.note)+' · <span class="fp-num">'+r.ex.length+' ejercicios</span></div></div><button class="fp-go" data-action="start-routine" data-id="'+r.id+'">Iniciar ›</button></div>';

function exercisesHTML(filter){
  var f=(filter||"").toLowerCase(), groups={}, order=[];

    groups[x.muscle].push(x);
  });
  var body=order.map(function(m){

      + groups[m].map(function(x){return '<div class="fp-row"><div class="t" style="font-size:14.5px">'+esc(x.name)+'</div><button class="fp-go" data-action="ex-detail" data-id="'+x.id+'">›</button></div>';}).join("")
      +'</div>';
  }).join("") || '<div class="fp-empty">Sin resultados.</div>';
  return '<div class="fp-h1">Ejercicios</div><input class="fp-search" id="fp-ex-search" placeholder="Buscar ejercicio o músculo" value="'+esc(filter||"")+'"><div id="fp-ex-list">'+body+'</div>';
}
function exerciseHTML(){
  var x=EX.find(function(e){return e.id===S.exDetail;})||EX[0];
  var past=S.history.slice(0,3).map(function(h,i){
    var kg=[80,82.5,77.5][i]||80;
    return '<div class="fp-row"><div class="t fp-num" style="font-size:14px">4 × 10 × '+kg+' kg</div><div class="s">RPE 8</div></div>';
  }).join("");
  return '<button class="fp-back" data-action="go" data-to="exercises">‹ Ejercicios</button>'

    +'<div class="fp-sec">Tu historial</div><div class="fp-card" style="padding:4px 15px">'+past+'</div>'
    +'<div style="height:14px"></div><button class="fp-btn" data-action="ex-add-workout" data-id="'+x.id+'">Añadir al entreno</button>';
}
function statsHTML(){
  var vols=[4820,7150,6030,5210,6890,4480,5920,6640], max=Math.max.apply(null,vols);
  var days=["L","M","X","J","V","S","D","L"];

    return '<div class="fp-bar'+(v===max?" max":"")+'"><i style="height:'+Math.round(v/max*100)+'%"></i><b>'+days[i]+'</b></div>';

  return '<div class="fp-h1">Stats</div><p class="fp-sub">Últimas 8 semanas.</p>'

    +'<div class="fp-sec">Volumen semanal · kg</div><div class="fp-card"><div class="fp-bars">'+bars+'</div></div>'
    +'<div class="fp-sec">Récords</div><div class="fp-card" style="padding:4px 15px">'
    +'<div class="fp-row"><div class="t" style="font-size:14px">Press banca plano</div><div class="s fp-num">1 × 100 kg</div></div>'
    +'<div class="fp-row"><div class="t" style="font-size:14px">Sentadilla con barra</div><div class="s fp-num">1 × 140 kg</div></div>'
    +'<div class="fp-row"><div class="t" style="font-size:14px">Peso muerto</div><div class="s fp-num">1 × 170 kg</div></div></div>';
}
function measuresHTML(){
  var list=S.measures.map(function(m){
    return '<div class="fp-row"><div class="t fp-num" style="font-size:15px">'+esc(m.v)+'</div><div class="s">'+esc(m.d)+'</div></div>';
  }).join("");
  return '<div class="fp-h1">Medidas</div><p class="fp-sub">Peso corporal.</p>'
    +'<div class="fp-card" style="padding:4px 15px">'+list+'</div>'
    +'<div class="fp-meas-input"><input id="fp-meas-in" placeholder="82,4" inputmode="decimal"><button class="fp-send" data-action="meas-add">Añadir</button></div>';
}
function moreHTML(){
  var th=S.theme==="dark"?"Oscuro":"Claro";
  return '<div class="fp-h1">Más</div><p class="fp-sub">Ajustes y datos.</p><div class="fp-card" style="padding:4px 15px">'
    +'<div class="fp-row"><div><div class="t" style="font-size:15px">Tema</div><div class="s">'+th+'</div></div><button class="fp-go" data-action="theme">Cambiar ›</button></div>'
    +'<div class="fp-row"><div><div class="t" style="font-size:15px">Unidades</div><div class="s">Kilogramos</div></div><span class="s">kg</span></div>'
    +'<div class="fp-row"><div><div class="t" style="font-size:15px">Exportar CSV</div><div class="s">Historial y medidas</div></div><button class="fp-go" data-action="export">›</button></div>'
    +'<div class="fp-row"><div><div class="t" style="font-size:15px">Copias de seguridad</div><div class="s">Última: hoy 09:12</div></div><button class="fp-go" data-action="backup">›</button></div>'
    +'<div class="fp-row"><div><div class="t" style="font-size:15px">Acerca de Ferrum</div><div class="s">v10 · 100 % local</div></div><span></span></div>'
    +'</div><p class="fp-note" style="margin-top:18px">Prototipo de diseño — los datos son de muestra.</p>';
}
</script>
<script>
/* ---- actions ---- */
var timerInt=null;
function tick(){
  if(!S.restRunning) return;
  S.restLeft--;
  var t=document.getElementById("fp-timer"); if(t) t.textContent=fmt(S.restLeft);
  if(S.restLeft<=0){ S.restRunning=false; clearInterval(timerInt); timerInt=null; save(); toast("Descanso terminado"); render(); }
}
function startTimer(){ if(timerInt) clearInterval(timerInt); timerInt=setInterval(tick,1000); }

function doOrder(cmd){
  var c=cmd.trim().toLowerCase();
  S.chat.push({from:"user",text:cmd.trim()});
  var reply;
  if(/ayuda/.test(c)) reply="Puedo:\n· crear rutina <nombre>\n· apunta <kg>x<reps> <ejercicio>\n· temporiza <segundos>\n· empieza entreno";
  else if(/crea rutina/.test(c)){
    var nm=cmd.replace(/crea rutina/i,"").trim()||"Nueva rutina";
    S.routines.push({id:"r"+Date.now(),name:nm.charAt(0).toUpperCase()+nm.slice(1),note:"Creada por orden",ex:["press-banca","sentadilla"]});
    reply="Rutina «"+nm+"» creada con 2 ejercicios. La tienes en Rutinas.";
  }
  else if(/apunta/.test(c)){
    var m=c.match(/(\d+[.,]?\d*)\s*x\s*(\d+)/);
    reply=m?("Apuntado: "+m[1]+" kg × "+m[2]+" reps."):"Dime kg y reps, p. ej. «apunta 80x10 press banca».";
    if(m&&S.workout&&S.workout.exercises.length){var e=S.workout.exercises[0];e.sets.push({kg:m[1].replace(".",","),reps:m[2],done:true});}
  }
  else if(/temporiza/.test(c)){
    var s=c.match(/(\d+)/); S.restLeft=s?parseInt(s[1],10):90; S.restRunning=false;
    reply="Temporizador a "+fmt(S.restLeft)+". Ábrelo en el entreno activo.";
  }
  else if(/empieza entreno|empezar/.test(c)){ startWorkout("Entreno libre",[]); reply="Entreno iniciado. Ve a Entrenar para verlo."; }
  else reply="No te he entendido. Prueba con «ayuda».";
  S.chat.push({from:"app",text:reply}); save(); render();
  var ch=document.getElementById("fp-chat"); if(ch) ch.lastChild.scrollIntoView();
}
function startWorkout(name,exIds){
  S.workout={name:name,exercises:exIds.map(function(id){return{exId:id,sets:[{kg:"",reps:"",done:false}]};})};
  S.restLeft=90; S.restRunning=false; S.pickEx=false; S.screen="workout"; save(); render();
}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-action]"); if(!b) return;
  var a=b.getAttribute("data-action");
  if(a==="pin-digit"){ if(S.pin.length<4){S.pin+=b.getAttribute("data-d");save(); if(S.pin.length===4){S.authed=true;S.pin="";save();} render();} }
  else if(a==="pin-del"){ S.pin=S.pin.slice(0,-1); save(); render(); }
  else if(a==="go"){ var to=b.getAttribute("data-to"); S.screen=to; if(to==="exercises"){} save(); render(); }
  else if(a==="start-empty"){ startWorkout("Entreno "+new Date().toLocaleDateString("es-ES",{day:"numeric",month:"short"}),[]); S.pickEx=true; save(); render(); }
  else if(a==="start-routine"){ var r=S.routines.find(function(x){return x.id===b.getAttribute("data-id");}); if(r) startWorkout(r.name,r.ex.slice()); }
  else if(a==="toggle-pick"){ S.pickEx=!S.pickEx; save(); render(); }
  else if(a==="pick"){ var w=S.workout; if(w){w.exercises.push({exId:b.getAttribute("data-id"),sets:[{kg:"",reps:"",done:false}]}); S.pickEx=false; save(); render(); toast("Ejercicio añadido");} }
  else if(a==="del-ex"){ var w2=S.workout; w2.exercises.splice(parseInt(b.getAttribute("data-ex"),10),1); save(); render(); }
  else if(a==="add-set"){ var e=S.workout.exercises[parseInt(b.getAttribute("data-ex"),10)]; var l=e.sets[e.sets.length-1]||{kg:"",reps:""}; e.sets.push({kg:l.kg,reps:l.reps,done:false}); save(); render(); }
  else if(a==="toggle-set"){ var s=S.workout.exercises[parseInt(b.getAttribute("data-ex"),10)].sets[parseInt(b.getAttribute("data-set"),10)]; s.done=!s.done; save(); render(); if(s.done&&!S.restRunning&&S.restLeft>0){S.restRunning=true;startTimer();render();} }
  else if(a==="timer-start"){ S.restLeft=90; S.restRunning=true; startTimer(); save(); render(); }
  else if(a==="timer-pause"){ S.restRunning=false; clearInterval(timerInt); timerInt=null; save(); render(); }
  else if(a==="timer-skip"||a==="timer-add"){ S.restLeft=a==="timer-add"?S.restLeft+30:0; if(S.restLeft<=0){S.restRunning=false;clearInterval(timerInt);timerInt=null;} save(); render(); }
  else if(a==="finish"){
    var w3=S.workout, n=w3.exercises.reduce(function(x,e){return x+e.sets.filter(function(s){return s.done;}).length;},0);
    S.history.unshift({id:"h"+Date.now(),name:w3.name,date:"Hoy · "+n+" series",vol:"—",sets:n,detail:w3.exercises.map(function(e){return exName(e.exId);}).join(" · ")});
    S.workout=null; S.restRunning=false; clearInterval(timerInt); timerInt=null; S.screen="train"; save(); render(); toast("Entreno guardado");
  }
  else if(a==="orders-send"){ var i=document.getElementById("fp-order-in"); if(i&&i.value.trim()) doOrder(i.value); }
  else if(a==="order-chip"){ doOrder(b.getAttribute("data-cmd")); }
  else if(a==="ex-detail"){ S.exDetail=b.getAttribute("data-id"); S.screen="exercise"; save(); render(); }
  else if(a==="ex-add-workout"){ if(!S.workout) startWorkout("Entreno libre",[b.getAttribute("data-id")]); else {S.workout.exercises.push({exId:b.getAttribute("data-id"),sets:[{kg:"",reps:"",done:false}]}); S.screen="workout";} save(); render(); toast("Añadido al entreno"); }
  else if(a==="meas-add"){ var mi=document.getElementById("fp-meas-in"); if(mi&&mi.value.trim()){S.measures.unshift({d:"Hoy",v:mi.value.trim().replace(".",",")+" kg"}); save(); render(); toast("Medida guardada");} }
  else if(a==="theme"){ S.theme=S.theme==="dark"?"light":"dark"; save(); render(); }
  else if(a==="export"){ toast("CSV generado (demo)"); }
  else if(a==="backup"){ toast("Copia creada (demo)"); }
});
document.addEventListener("change",function(ev){
  var i=ev.target;
  if(i.matches("[data-ex][data-set][data-f]")){
    var s=S.workout.exercises[parseInt(i.getAttribute("data-ex"),10)].sets[parseInt(i.getAttribute("data-set"),10)];
    s[i.getAttribute("data-f")]=i.value; save();
  }
});
document.addEventListener("input",function(ev){
  if(ev.target.id==="fp-ex-search"){
    var list=document.getElementById("fp-ex-list"); if(!list) return;
    var f=ev.target.value.toLowerCase(), groups={}, order=[];
    EX.forEach(function(x){
      if(f&&x.name.toLowerCase().indexOf(f)<0&&x.muscle.toLowerCase().indexOf(f)<0) return;
      if(!groups[x.muscle]){groups[x.muscle]=[];order.push(x.muscle);} groups[x.muscle].push(x);
    });
    list.innerHTML=order.map(function(m){
      return '<div class="fp-muscle">'+m+'</div><div class="fp-card" style="padding:4px 15px">'+groups[m].map(function(x){
        return '<div class="fp-row"><div class="t" style="font-size:14.5px">'+x.name+'</div><button class="fp-go" data-action="ex-detail" data-id="'+x.id+'">›</button></div>';
      }).join("")+'</div>';
    }).join("")||'<div class="fp-empty">Sin resultados.</div>';
  }
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target.id==="fp-order-in"){ var i=document.getElementById("fp-order-in"); if(i.value.trim()) doOrder(i.value); }
  if(ev.key==="Enter"&&ev.target.id==="fp-meas-in"){ var m=document.getElementById("fp-meas-in"); if(m.value.trim()){S.measures.unshift({d:"Hoy",v:m.value.trim().replace(".",",")+" kg"}); save(); render(); toast("Medida guardada");} }
});
render();
</script>
</body>
